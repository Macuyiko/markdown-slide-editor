[project]
name = "markdown-slide-editor"
version = "0.1.0"
description = "A browser-based Markdown slide editor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask-jsglue>=0.3.1",
    "flask>=3.1.0",
    "markdown>=3.7",
    "beautifulsoup4>=4.13.1",
    "python-markdown-math>=0.8",
    "lxml>=5.3.0",
    "pygments>=2.19.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# app.py imports flask_jsglue after the jinja2.Markup monkeypatch on purpose
"app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
