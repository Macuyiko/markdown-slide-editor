        <title>Slide Editor</title>
    </head>
    <body>
        <div class="container">
            <div class="row nav">
                <div class="column">
                    <span class="filename"><input type="text" name="filename" id="filename" value="new file.md" /></span>
                    <span class="glow">•</span>
                    
                    <div class="iconbar">
                        <span class="icon open">📂</span>
                        <span class="icon save">💾</span>
                        <span class="icon new">📄</span>
                        <span class="icon print">🖨️</span>
                        <span class="icon view">🔍</span>
                        <span class="icon present">📺</span>
                        <input type="file" name="open" id="open" />
                    </div>
                </div>
            </div>
            <div class="row editor">
                <div class="split" id="editor-pane">
                    <div id="editor" spellcheck="true"></div>
                </div>
                <div class="split" id="preview-pane">
                    <iframe id="preview-frame" name="preview-frame" src="{{ url_for('preview') }}">
                </div>
            </div>
        </div>
        
    </body>
</html>
